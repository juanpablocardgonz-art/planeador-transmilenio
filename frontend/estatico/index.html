<!doctype html>
<!--
  frontend/estatico/index.html
  Interfaz de la app, organizada por QUIÉN la usa (no por número de
  requisito): Viajar, Estaciones, Operar la red, Hora pico y Cómo funciona.
  Solo muestra datos y llama a la API (/api/...) del servidor, que a su vez
  llama al motor. Aquí NO hay reglas del sistema.
  El interruptor "Modo explicación" revela, en cada pantalla, una tarjeta
  "Bajo el capó" con la estructura de datos, el algoritmo y la complejidad
  que usa el motor (útil para la sustentación); desactivado, la app se ve
  limpia para un usuario normal.
-->
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Planeador TransMilenio</title>
  <link rel="stylesheet" href="estilos.css">
  <link rel="stylesheet" href="viajar.css">
  <link rel="stylesheet" href="estaciones.css">
  <link rel="stylesheet" href="operar.css">
  <link rel="stylesheet" href="hora-pico.css">
  <link rel="stylesheet" href="como-funciona.css">
</head>
<body>
  <header class="barra">
    <div class="marca">
      <span class="logo" aria-hidden="true">TM</span>
      <div>
        <h1>Planeador TransMilenio</h1>
        <p class="sub">La red real de TransMilenio, para cualquier persona</p>
      </div>
    </div>
    <div class="cabecera-derecha">
      <div class="estado-red" id="estado-red">Cargando red…</div>
      <button type="button" id="btn-modo-explicacion" class="interruptor" aria-pressed="false">
        <span class="pista" aria-hidden="true"></span> Modo explicación
      </button>
    </div>
  </header>

  <!-- Navegación de escritorio (barra superior) -->
  <nav class="nav-superior" aria-label="Pantallas de la app">
    <button class="nav-boton" data-panel="viajar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17h16M6 17l1.5-6h9L18 17M9 11V6a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="8" cy="19.3" r="1.3" fill="currentColor"/><circle cx="16" cy="19.3" r="1.3" fill="currentColor"/></svg>
      Viajar
    </button>
    <button class="nav-boton" data-panel="estaciones">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M15.5 15.5 21 21" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      Estaciones
    </button>
    <button class="nav-boton" data-panel="operar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h16M8 6l-4.5 6L8 18M16 6l4.5 6-4.5 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Operar la red
    </button>
    <button class="nav-boton" data-panel="horapico">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 7.5v4.8l3.4 2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Hora pico
    </button>
    <button class="nav-boton" data-panel="comofunciona">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 16.2v.01M12 7.8a2.4 2.4 0 0 1 2.4 2.4c0 1.6-2.4 1.9-2.4 3.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Cómo funciona
    </button>
  </nav>

  <main>
    <!-- =================================================== A. VIAJAR -->
    <section class="panel" id="panel-viajar">
      <p class="cargando">Cargando…</p>
    </section>

    <!-- =============================================== B. ESTACIONES -->
    <section class="panel" id="panel-estaciones">
      <p class="cargando">Cargando…</p>
    </section>

    <!-- ============================================ C. OPERAR LA RED -->
    <section class="panel" id="panel-operar">
      <p class="cargando">Cargando…</p>
    </section>

    <!-- ================================================ D. HORA PICO -->
    <section class="panel" id="panel-horapico">
      <p class="cargando">Cargando…</p>
    </section>

    <!-- =========================================== E. CÓMO FUNCIONA -->
    <section class="panel" id="panel-comofunciona">
      <p class="cargando">Cargando…</p>
    </section>
  </main>

  <!-- Navegación de celular (barra inferior), mismos botones que arriba -->
  <nav class="nav-inferior" aria-label="Pantallas de la app">
    <button class="nav-boton" data-panel="viajar" aria-label="Viajar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17h16M6 17l1.5-6h9L18 17M9 11V6a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="8" cy="19.3" r="1.3" fill="currentColor"/><circle cx="16" cy="19.3" r="1.3" fill="currentColor"/></svg>
      Viajar
    </button>
    <button class="nav-boton" data-panel="estaciones" aria-label="Estaciones">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M15.5 15.5 21 21" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      Estaciones
    </button>
    <button class="nav-boton" data-panel="operar" aria-label="Operar la red">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h16M8 6l-4.5 6L8 18M16 6l4.5 6-4.5 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Operar
    </button>
    <button class="nav-boton" data-panel="horapico" aria-label="Hora pico">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 7.5v4.8l3.4 2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Hora pico
    </button>
    <button class="nav-boton" data-panel="comofunciona" aria-label="Cómo funciona">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 16.2v.01M12 7.8a2.4 2.4 0 0 1 2.4 2.4c0 1.6-2.4 1.9-2.4 3.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Info
    </button>
  </nav>

  <!-- Listas de respaldo para autocompletado nativo (lectores de pantalla, etc.) -->
  <datalist id="lista-estaciones"></datalist>
  <datalist id="lista-rutas"></datalist>

  <div id="toast" class="toast" role="status"></div>

  <script src="comun.js"></script>
  <script src="viajar.js"></script>
  <script src="estaciones.js"></script>
  <script src="operar.js"></script>
  <script src="hora-pico.js"></script>
  <script src="como-funciona.js"></script>
  <script>inicioComun();</script>
</body>
</html>
